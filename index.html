<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#1b3a52" />
        <title>ducks</title>
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet" />
        <style>
            :root {
                --water: #1b3a52;
                --ink: #10243a;
                --cream: #fff6dc;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: var(--water);
                color: var(--cream);
                font-family: 'Silkscreen', ui-monospace, monospace;
                -webkit-font-smoothing: none;
            }
            #pond {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                display: block;
                cursor: url(cursor.svg) 8 8, crosshair;
                touch-action: none;
                opacity: 0;
                transition: opacity 1.2s ease-out;
            }
            .ready #pond {
                opacity: 1;
            }
            #status {
                position: fixed;
                top: 20px;
                left: 24px;
                margin: 0;
                pointer-events: none;
                /* a hard pixel shadow, like the outlines in the art */
                text-shadow: 2px 2px 0 var(--ink);
                font-size: 8px;
                letter-spacing: 0.06em;
                opacity: 0.85;
            }
            #status:empty {
                display: none;
            }
        </style>
    </head>
    <body>
        <canvas id="pond"></canvas>
        <p id="status"></p>
        <script type="module" src="/src/index.ts"></script>
    </body>
</html>
